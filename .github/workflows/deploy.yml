name: Deploy to Testnet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stellar-testnet-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.85-${{ hashFiles('**/Cargo.lock') }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binaryen libdbus-1-dev pkg-config

      - name: Install Stellar CLI
        # Keep the CLI compatible with the pinned Rust/Soroban toolchain.
        # Installing the latest release can require a newer Rust compiler.
        run: cargo install --locked stellar-cli --version 23.0.1

      - name: Configure Stellar account
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: |
          if [ -z "$STELLAR_SECRET_KEY" ]; then
            echo "::error::Repository secret STELLAR_SECRET_KEY is required."
            exit 1
          fi
          stellar keys add deployer --secret-key "$STELLAR_SECRET_KEY"

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release --workspace

      - name: Optimize WASM
        run: |
          for f in target/wasm32-unknown-unknown/release/*.wasm; do
            wasm-opt "$f" --disable-reference-types -O2 -o "$f"
          done

      - name: Deploy contracts
        env:
          SOURCE: deployer
          NETWORK: testnet
        run: bash scripts/deploy.sh

      - name: Initialize contracts
        env:
          SOURCE: deployer
          NETWORK: testnet
        run: bash scripts/initialize.sh

      - name: Upload contract addresses
        uses: actions/upload-artifact@v4
        with:
          name: contract-addresses
          path: frontend/.env.local
          if-no-files-found: error
